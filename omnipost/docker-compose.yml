name: advocate-social-automation

services:
  # =================================================================
  # Advocate Content Portal (React dashboard + Express API)
  # Express serves the built React bundle and the API on one port (3300).
  # =================================================================
  advocate-web-portal:
    build:
      context: ./web
    container_name: advocate-web-portal
    restart: always
    ports:
      - "${WEB_PORT:-3300}:3300"
    environment:
      - NODE_ENV=production
      - WEB_PORT=3300
      - N8N_INTERNAL_URL=http://n8n-automation:5678
      - N8N_PUBLIC_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - TZ=${TZ:-Asia/Kolkata}

      # --- Role-separated access keys --------------------------------------
      # These were absent, so the local stack ran on the development fallback
      # passkey with no Supabase at all - which meant "it works in compose"
      # told you nothing about whether the real configuration works. Required,
      # not defaulted: the server now refuses to start in production without
      # the chambers key, and compose should fail the same way rather than
      # booting something different from production.
      - CHAMBERS_ADMIN_SECRET_KEY=${CHAMBERS_ADMIN_SECRET_KEY:?set CHAMBERS_ADMIN_SECRET_KEY in automation/.env}
      - AUTOMATION_SECRET_KEY=${AUTOMATION_SECRET_KEY:?set AUTOMATION_SECRET_KEY in automation/.env}

      # --- Persistence + Supabase Auth -------------------------------------
      # SUPABASE_ANON_KEY is what a browser would use to sign a user in; the
      # service-role key stays server-side and is what verifies their JWT.
      - SUPABASE_URL=${SUPABASE_URL:-}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY:-}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY:-}

      # --- Google Drive vault ----------------------------------------------
      - GOOGLE_DRIVE_FOLDER_ID=${GOOGLE_DRIVE_FOLDER_ID:-}

      # --- Publishing channels (absent ones report NEEDS_CONFIGURATION) ----
      - META_GRAPH_VERSION=${META_GRAPH_VERSION:-v21.0}
      - FACEBOOK_PAGE_ID=${FACEBOOK_PAGE_ID:-}
      - FACEBOOK_PAGE_ACCESS_TOKEN=${FACEBOOK_PAGE_ACCESS_TOKEN:-}
      - FACEBOOK_PAGE_NAME=${FACEBOOK_PAGE_NAME:-}
      - INSTAGRAM_BUSINESS_ACCOUNT_ID=${INSTAGRAM_BUSINESS_ACCOUNT_ID:-}
      - INSTAGRAM_USERNAME=${INSTAGRAM_USERNAME:-}
      - THREADS_USER_ID=${THREADS_USER_ID:-}
      - THREADS_ACCESS_TOKEN=${THREADS_ACCESS_TOKEN:-}
      - LINKEDIN_ACCESS_TOKEN=${LINKEDIN_ACCESS_TOKEN:-}
      - LINKEDIN_AUTHOR_URN=${LINKEDIN_AUTHOR_URN:-}
      - LINKEDIN_DISPLAY_NAME=${LINKEDIN_DISPLAY_NAME:-}
      - PINTEREST_ACCESS_TOKEN=${PINTEREST_ACCESS_TOKEN:-}
      - PINTEREST_BOARD_ID=${PINTEREST_BOARD_ID:-}
      - PINTEREST_BOARD_NAME=${PINTEREST_BOARD_NAME:-}
      - CORS_EXTRA_ORIGINS=${CORS_EXTRA_ORIGINS:-}
    depends_on:
      - n8n
    networks:
      - advocate-network
    # Mirrors the Render free tier. Without it the container gets the whole
    # host and a memory problem only shows up in production.
    mem_limit: 512m

  # =================================================================
  # n8n Workflow Automation Engine
  # =================================================================
  # !! THIS POINTS AT THE PRODUCTION DATABASE (SUPABASE_DB_* in .env). !!
  # Do not run it while the Render n8n service is live. Two n8n instances on
  # one schema both fire every Schedule Trigger - duplicate YouTube uploads,
  # duplicate approval mails - and if their versions differ, the older one runs
  # against tables the newer one has already migrated. On 2026-09-23 a local
  # 1.68.0 container was found doing exactly that, against a schema Render's
  # 2.x had migrated that afternoon. For local experiments, point
  # SUPABASE_DB_SCHEMA at a separate schema instead.
  n8n:
    # Pinned to the same release as render.yaml - see the note there.
    image: docker.io/n8nio/n8n:2.40.5
    container_name: n8n-automation
    # unless-stopped, not always: this instance shares the PRODUCTION schema
    # (see the warning above). With "always", a container stopped by hand came
    # back by itself the next time Docker Desktop started - found on
    # 2026-09-25 running alongside the Render service. A manual stop must stick.
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      # Editor auth (always on in 2.x) and no public REST API - the same
      # posture as render.yaml, so local and production do not diverge.
      - N8N_PUBLIC_API_DISABLED=true
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=${N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS:-true}
      - N8N_DEFAULT_BINARY_DATA_MODE=${N8N_DEFAULT_BINARY_DATA_MODE:-filesystem}
      - N8N_FORMDATA_FILE_SIZE_MAX=500
      # No default: this key encrypts every stored OAuth credential, and the
      # old fallback value is published in this repository. A stack that boots
      # with a known encryption key is worse than one that refuses to boot.
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in automation/.env}

      # --- Persistence: the chambers Supabase Postgres --------------------
      # One database for the whole practice. n8n previously had its own Neon
      # project; that was a second database, a second backup story and a
      # second thing to keep alive for an engine that has to reach Supabase
      # anyway.
      #
      # DB_POSTGRESDB_SCHEMA keeps n8n's ~30 internal tables out of `public`,
      # away from will_submissions and content_calendar. Run
      # supabase/n8n-schema.sql once before first boot - n8n expects to FIND
      # the schema and fails its first migration if it is absent.
      #
      # HOST must be the SESSION POOLER, not the direct connection:
      #   db.<ref>.supabase.co  resolves to IPv6 ONLY on the free tier, and a
      #                         default Docker bridge network has no IPv6
      #                         route - verified: UNREACHABLE from a container.
      #   aws-0-<region>.pooler.supabase.com:5432  IPv4, session mode. Works.
      # Port 6543 on the same host is the TRANSACTION pooler: it does not keep
      # session state, and n8n's TypeORM migrations need prepared statements
      # and advisory locks. Use 5432.
      #
      # USER on the pooler is "postgres.<project-ref>", not "postgres".
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=${SUPABASE_DB_HOST:?set SUPABASE_DB_HOST (Supabase -> Connect -> Session pooler)}
      - DB_POSTGRESDB_PORT=${SUPABASE_DB_PORT:-5432}
      - DB_POSTGRESDB_DATABASE=${SUPABASE_DB_NAME:-postgres}
      - DB_POSTGRESDB_USER=${SUPABASE_DB_USER:?set SUPABASE_DB_USER, e.g. postgres.<project-ref>}
      - DB_POSTGRESDB_PASSWORD=${SUPABASE_DB_PASSWORD:?set SUPABASE_DB_PASSWORD (Supabase -> Settings -> Database)}
      - DB_POSTGRESDB_SCHEMA=${SUPABASE_DB_SCHEMA:-n8n}
      # Encrypted AND verified against Supabase's public root CA (mounted
      # below). "REJECT_UNAUTHORIZED=false" encrypted without checking who
      # answered; the "=true" it replaced did not enable TLS at all. See the
      # TLS block in render.yaml for the measurements. n8n logs a harmless
      # "value was trimmed" notice for the file's trailing newline.
      - DB_POSTGRESDB_SSL_ENABLED=true
      - DB_POSTGRESDB_SSL_REJECT_UNAUTHORIZED=true
      - DB_POSTGRESDB_SSL_CA_FILE=/opt/supabase/supabase-root-2021-ca.crt
      # Pool and health checks sized for Render's 0.1 CPU - the measurements
      # and the reasoning are in render.yaml's pool block.
      - DB_POSTGRESDB_POOL_SIZE=${SUPABASE_DB_POOL_SIZE:-4}
      - DB_POSTGRESDB_CONNECTION_TIMEOUT=30000
      - DB_PING_TIMEOUT_MS=30000

      # Executions accumulate in the SAME 500 MB free tier as the legal
      # tables, so pruning is not optional here.
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=${N8N_EXECUTIONS_MAX_AGE_HOURS:-168}
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=${N8N_EXECUTIONS_MAX_COUNT:-2000}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      # Public-facing base URL. N8N_EDITOR_BASE_URL is what n8n uses to build
      # OAuth callback URLs, so it must match the redirect URI registered in
      # Google/Meta consoles: {N8N_PUBLIC_URL}/rest/oauth2-credential/callback
      - N8N_EDITOR_BASE_URL=${N8N_PUBLIC_URL:-http://localhost:5678}
      # N8N_WEBHOOK_URL replaces the deprecated WEBHOOK_URL in 2.x.
      - N8N_WEBHOOK_URL=${N8N_PUBLIC_URL:-http://localhost:5678}/
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      # What makes 2.x boot inside 512 MB - identical to render.yaml, where the
      # measurements and the reasoning for each module are recorded.
      - N8N_DISABLED_MODULES=insights,external-secrets,community-packages,provisioning,breaking-changes,source-control,dynamic-credentials,chat-hub,sso-oidc,sso-saml,log-streaming,ldap,workflow-builder,instance-registry,otel,workflow-reviews,instance-ai
      - NODE_OPTIONS=--max-old-space-size=256
      - N8N_RUNNERS_MAX_OLD_SPACE_SIZE=96
      - N8N_RUNNERS_GRANT_TOKEN_TTL=120
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    volumes:
      # Workflows, credentials and executions now live in Supabase; this volume
      # holds only n8n's local config and binary-mode staging.
      - n8n-data:/home/node/.n8n
      - ./n8n:/data/n8n-workflows
      - ./supabase/supabase-root-2021-ca.crt:/opt/supabase/supabase-root-2021-ca.crt:ro
    networks:
      - advocate-network
    # 512m, matching Render's free instance. This was 768m, which is how an
    # n8n that cannot boot in 512 MB (2.x with every module loaded) looked
    # healthy here and failed only on Render.
    mem_limit: 512m

  # =================================================================
  # Postiz Social Media Scheduling Engine
  # =================================================================
  # ---------------------------------------------------------------------------
  # POSTIZ AND TEMPORAL REMOVED — the stack is now Postiz-independent.
  #
  # Publishing is done by our own adapters in automation/web/publishing/:
  #   facebook, instagram, threads   meta.js
  #   linkedin                       linkedin.js
  #   pinterest                      pinterest.js
  #   youtube                        n8n workflow (needs a real resumable upload)
  #
  # Why they are gone:
  #   * Postiz routes every publish through Temporal, which needs Elasticsearch
  #     plus its own Postgres. Measured at ~2.34 GB — it cannot fit a 512 MB
  #     free instance, and Elasticsearch needs a paid always-on disk.
  #   * Seven services became two.
  #   * It also removes the Postiz JWT secret, which had been committed to git.
  #
  # DATA SAFETY: removing these service definitions does NOT delete their
  # volumes. postiz-postgres-data, postiz-redis-data, postiz-config,
  # postiz-uploads, temporal-es-data and temporal-pg-data remain on disk.
  # Confirm nothing is needed from them, then remove deliberately:
  #   docker volume rm advocate-social-automation_postiz-postgres-data  (etc.)
  # ---------------------------------------------------------------------------

volumes:
  n8n-data:

networks:
  advocate-network:
    driver: bridge
