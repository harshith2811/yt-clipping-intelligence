# =============================================================================
# VBL Law Chambers — nginx reverse proxy (alternative to Caddy)
#
# ⚠️  COST NOTE
# Like the Caddyfile, this only applies if you run on a server you control
# (e.g. an Oracle Cloud Always Free VM). On Render you need neither file.
#
# ⚠️  ORDER MATTERS — certificates must exist BEFORE nginx starts
# An `ssl_certificate` line pointing at a file that does not exist makes
# `nginx -t` fail and nginx refuse to start, which then blocks certbot's HTTP-01
# challenge — a deadlock that is easy to walk into.
#
# Correct sequence:
#   1. Install this file WITHOUT the TLS server blocks (comment them out), so
#      only the port-80 blocks are active.
#        sudo nginx -t && sudo systemctl reload nginx
#   2. Obtain certificates with the standalone/webroot challenge:
#        sudo certbot certonly --webroot -w /var/www/certbot \
#          -d vbllawchambers.com -d www.vbllawchambers.com \
#          -d admin.vbllawchambers.com \
#          -d automation.vbllawchambers.com \
#          -d n8n.vbllawchambers.com
#   3. Uncomment the TLS blocks, then:
#        sudo nginx -t && sudo systemctl reload nginx
#   4. Renewal is automatic; verify with: sudo certbot renew --dry-run
# =============================================================================

# --- Websocket upgrade map (required by n8n's editor) ------------------------
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# --- Shared proxy headers ----------------------------------------------------
# Included by every proxying block so the app sees the real client address.
# Express runs with `trust proxy`, and the tracker throttle buckets on req.ip:
# without X-Forwarded-For every visitor would share one bucket and the whole
# practice would be rate-limited together.
# (Kept inline rather than in a separate file to keep this deployable as one unit.)

# =============================================================================
# HTTP :80 — ACME challenge + permanent redirect to HTTPS
# =============================================================================
server {
    listen 80;
    listen [::]:80;
    server_name vbllawchambers.com www.vbllawchambers.com
                admin.vbllawchambers.com
                automation.vbllawchambers.com
                n8n.vbllawchambers.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =============================================================================
# 1. PUBLIC WEBSITE — vbllawchambers.com
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name vbllawchambers.com www.vbllawchambers.com;

    ssl_certificate     /etc/letsencrypt/live/vbllawchambers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vbllawchambers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    root /srv/vbllawchambers/website/dist;

    # Pre-rendered routes are served as real files first; only genuinely unknown
    # paths fall through to the SPA shell. Reversing this order would serve
    # index.html for /about and silently destroy its SEO markup.
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# 2. CHAMBERS LEGAL VAULT — admin.vbllawchambers.com
#    Client wills and testator PII. Framing denied outright; never cached.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.vbllawchambers.com;

    ssl_certificate     /etc/letsencrypt/live/admin.vbllawchambers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.vbllawchambers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    add_header Cache-Control "no-store" always;

    gzip on;
    gzip_types text/css application/javascript application/json;

    root /srv/vbllawchambers/website/dist;

    location = / {
        return 301 /admin;
    }

    location / {
        try_files $uri $uri.html /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# =============================================================================
# 3. PUBLISHING SUITE — automation.vbllawchambers.com
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name automation.vbllawchambers.com;

    ssl_certificate     /etc/letsencrypt/live/automation.vbllawchambers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/automation.vbllawchambers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Matches the multer fileSize cap in server.js (500 MB); keeping them in sync means
    # an oversized upload fails fast with 413 instead of dying mid-transfer.
    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:3300;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Upgrade headers so publish-progress streaming works if it is ever
        # moved from polling to SSE/websockets.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Long uploads and Instagram container polling need generous timeouts.
        proxy_read_timeout    300s;
        proxy_send_timeout    300s;
        proxy_request_buffering off;   # stream uploads straight through
    }
}

# =============================================================================
# 4. WORKFLOW HUB — n8n.vbllawchambers.com
#    Editor UI protected by n8n's own basic auth. /webhook/* must remain open:
#    Meta, Google and the portal call it unauthenticated.
# =============================================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name n8n.vbllawchambers.com;

    ssl_certificate     /etc/letsencrypt/live/n8n.vbllawchambers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/n8n.vbllawchambers.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    client_max_body_size 500M;

    location / {
        proxy_pass http://127.0.0.1:5678;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # n8n's editor is a live websocket app: without these the canvas loads
        # but executions never stream and the UI looks frozen.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_buffering off;
    }
}
