services:
  # ==============================================================================
  # 24/7 Autonomous Discovery & Clipping Daemon
  # Continuously polls creator channels via RSS/API and dispatches jobs
  # ==============================================================================
  clipping-daemon:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-daemon
    restart: unless-stopped
    command: ["daemon"]
    ports:
      - "8088:8088"
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - POLL_INTERVAL=${POLL_INTERVAL:-300}
      - DEFAULT_LAYOUT_MODE=blur_background
      - DEFAULT_SUBTITLE_PRESET=hormozi
      - OMNIPOST_BASE_URL=${OMNIPOST_BASE_URL:-http://host.docker.internal:3300}
      - OMNIPOST_API_KEY=${OMNIPOST_API_KEY:-}
      - AUTOMATION_SECRET_KEY=${AUTOMATION_SECRET_KEY:-}

  # ==============================================================================
  # 24/7 Priority Job Queue Processing Worker
  # Leases and processes rendering, AI framing, transcription, and QA verification
  # ==============================================================================
  clipping-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-worker
    restart: unless-stopped
    command: ["worker"]
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - POLL_INTERVAL=5.0
      - OMNIPOST_BASE_URL=${OMNIPOST_BASE_URL:-http://host.docker.internal:3300}
      - OMNIPOST_API_KEY=${OMNIPOST_API_KEY:-}
      - AUTOMATION_SECRET_KEY=${AUTOMATION_SECRET_KEY:-}

  # ==============================================================================
  # Model Context Protocol (MCP) Server
  # Exposes JSON-RPC 2.0 tools for AI agents and agentic IDEs
  # ==============================================================================
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yt-clipping-mcp
    restart: unless-stopped
    command: ["mcp"]
    profiles: ["mcp"]
    volumes:
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
      - YOUTUBE_API_KEY=${YOUTUBE_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OMNIPOST_BASE_URL=${OMNIPOST_BASE_URL:-http://host.docker.internal:3300}
