version: "3.8"

# ==============================================================================
# YouTube Clipping Intelligence Platform - GPU Server Deployment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# ==============================================================================

services:
  clipping-daemon:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1

  clipping-worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1
