# ==============================================================================
# YouTube Clipping Intelligence Platform - GPU Server Deployment Override
# Usage: docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
# ==============================================================================

services:
  studio:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1
      - RENDER_VCODEC=h264_nvenc
      - TRANSCRIPTION_DEVICE=cuda

  daemon:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1
      - RENDER_VCODEC=h264_nvenc
      - TRANSCRIPTION_DEVICE=cuda

  worker:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1
      - RENDER_VCODEC=h264_nvenc
      - TRANSCRIPTION_DEVICE=cuda

  mcp-server:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, video, compute]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - USE_GPU=1
      - RENDER_VCODEC=h264_nvenc
      - TRANSCRIPTION_DEVICE=cuda
